name: Check Poietra

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Check generated adapters and MoonBit types
        run: |
          python3 scripts/generate-adapters.py
          node scripts/client-runtime.mjs
          moon fmt
          git diff --exit-code -- moonbit apps/studio/shared/scene-types.d.ts
          moon check --target js --deny-warn
      - run: pnpm test
      - name: Check headless API and MCP without browser or FFmpeg
        run: pnpm test:render
      - name: Check generated public bindings
        run: git diff --exit-code -- apps/studio/src apps/studio/shared apps/studio/server apps/studio/worker
      - run: node scripts/moon.mjs test --target js
      - run: node scripts/moon.mjs test --target wasm moonbit/motion moonbit/proposal_plan moonbit/editor moonbit/scene moonbit/render moonbit/exporting moonbit/audio moonbit/media_pipeline moonbit/render_job

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: pnpm build:moonbit
      - run: pnpm --dir apps/studio exec playwright install --with-deps chromium
      - name: Check editor and browser component contracts
        run: pnpm --dir apps/studio test:e2e --shard=${{ matrix.shard }}/4
      - name: Preserve timings and browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          path: apps/studio/test-results/

  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: pnpm build:moonbit
      - run: pnpm --dir apps/studio exec playwright install --with-deps chromium
      - name: Install independent video verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check media import, project playback and independently decoded downloads
        run: pnpm --dir apps/studio test:media-editor
      - name: Check MP4/WebM rendering of hierarchy and value curves
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/studio test:export
      - name: Check media decoding, stereo mixing and browser audio playback
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/studio test:media
      - name: Preserve media timings and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media
          retention-days: 7
          if-no-files-found: warn
          path: apps/studio/test-results/

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: pnpm --dir apps/studio build:web
      - run: pnpm --dir apps/studio exec playwright install --with-deps chromium
      - name: Check prerendered pages, hydration and project creation in production
        run: pnpm --dir apps/studio test:site
      - name: Check real Worker startup, hibernation and restart recovery
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/studio exec node tests/collaboration-worker.integration.mjs --port 8796
      - name: Check local media persistence and R2 migration/failure recovery
        if: ${{ !cancelled() }}
        run: |
          pnpm --dir apps/studio exec node tests/media-storage.integration.mjs node
          pnpm --dir apps/studio exec node tests/r2-assets-worker.integration.mjs
      - name: Check account isolation, callback races and TTL across Worker restarts
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/studio exec node tests/accounts-worker.integration.mjs
      - name: Preserve production timings and runtime failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/studio/test-results/
            /tmp/poietra-media-storage-*/*.log
            /tmp/poietra-accounts-worker-*/*.log

  # Preserve the existing required check name, including failures in any shard.
  check:
    if: ${{ always() }}
    needs: [core, browser, media, production]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test suite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Unsuccessful suites: {failed}')
          PYTHON
